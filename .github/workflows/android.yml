name: Build Mingle Android APK
# Mingle v2.0.8: Redesigned group creation, live member search and group settings.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android.yml'
concurrency:
  group: mingle-android-release
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check Android SDK
        run: test -d "$ANDROID_HOME" && echo "Android SDK available on runner"
      - name: Install dependencies
        run: npm install
      - name: Build website
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Configure Android microphone and camera permissions
        run: python scripts/android_permissions.py
      - name: Configure Firebase Android services
        env:
          MINGLE_FIREBASE_JSON_B64: ${{ secrets.MINGLE_FIREBASE_JSON_B64 }}
        run: |
          if [ -n "$MINGLE_FIREBASE_JSON_B64" ]; then
            printf "%s" "$MINGLE_FIREBASE_JSON_B64" | base64 --decode > android/app/google-services.json
            python scripts/android_firebase.py
          else
            echo "::notice::Firebase config secret missing; push notifications are not enabled."
          fi
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Set Android APK version
        run: python scripts/android_version.py
      - name: Configure Android Google login callback
        run: python scripts/android_oauth.py
      - name: Generate official Mingle app icons
        run: |
          python -m pip install cairosvg pillow
          python scripts/android_icons.py
      - name: Check release signing availability
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.MINGLE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.MINGLE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MINGLE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MINGLE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Release signing not configured; debug APK only."
          fi
      - name: Configure signed release
        if: steps.signing.outputs.ready == 'true'
        env:
          MINGLE_KEYSTORE_B64: ${{ secrets.MINGLE_KEYSTORE_B64 }}
          MINGLE_KEYSTORE_PASSWORD: ${{ secrets.MINGLE_KEYSTORE_PASSWORD }}
          MINGLE_KEY_ALIAS: ${{ secrets.MINGLE_KEY_ALIAS }}
          MINGLE_KEY_PASSWORD: ${{ secrets.MINGLE_KEY_PASSWORD }}
        run: |
          printf '%s' "$MINGLE_KEYSTORE_B64" | base64 --decode > android/app/mingle-release.jks
          echo "MINGLE_KEYSTORE_FILE=mingle-release.jks" >> "$GITHUB_ENV"
          python scripts/android_signing.py
      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        working-directory: android
        env:
          MINGLE_KEYSTORE_PASSWORD: ${{ secrets.MINGLE_KEYSTORE_PASSWORD }}
          MINGLE_KEY_ALIAS: ${{ secrets.MINGLE_KEY_ALIAS }}
          MINGLE_KEY_PASSWORD: ${{ secrets.MINGLE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Upload signed release APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Mingle-Android-Signed-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish official signed APK release
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0.8 >/dev/null 2>&1; then
            gh release upload v2.0.8 android/app/build/outputs/apk/release/app-release.apk --clobber
          else
            gh release create v2.0.8 android/app/build/outputs/apk/release/app-release.apk --title "Mingle Android 2.0.8" --notes "Android pushmeldingen voor privéberichten, groepschats en nieuwe volgers, ook wanneer Mingle gesloten is. Tik op een melding om het gesprek of je meldingen te openen. Inclusief mobiele UI-verbeteringen."
          fi
      - name: Build installable test APK
        if: steps.signing.outputs.ready != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        if: steps.signing.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Mingle-Android-Test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

